name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: read    # source repo stays private — releases go to axon-releases via PAT

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            archive_ext: tar.gz
          - target: macos-arm64
            os: macos-14
            archive_ext: tar.gz
          - target: windows-x64
            os: windows-2022
            archive_ext: zip
    env:
      AXON_DUCKDB_VERSION: 1.1.3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Stage libduckdb.dylib (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${AXON_DUCKDB_VERSION}/libduckdb-osx-universal.zip"
          mkdir -p third_party/duckdb/lib
          unzip -o /tmp/duckdb.zip -d third_party/duckdb/lib/
          test -f third_party/duckdb/lib/libduckdb.dylib

      - name: Stage duckdb.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:AXON_DUCKDB_VERSION
          Invoke-WebRequest -Uri "https://github.com/duckdb/duckdb/releases/download/v$ver/libduckdb-windows-amd64.zip" `
            -OutFile "$env:TEMP\duckdb.zip"
          New-Item -ItemType Directory -Force -Path third_party\duckdb\lib | Out-Null
          Expand-Archive -Path "$env:TEMP\duckdb.zip" -DestinationPath third_party\duckdb\lib -Force
          if (-not (Test-Path "third_party\duckdb\lib\duckdb.dll")) { exit 1 }

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja

      - name: Build
        run: cmake --build build --target axon -j 2

      - name: Resolve version
        id: ver
        shell: bash   # explicit bash — runner default is pwsh on windows-2022
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "${tag}" = "${GITHUB_REF}" ]; then tag="${{ github.event.inputs.tag }}"; fi
          version="${tag#v}"
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Stage release tree (Unix)
        if: runner.os != 'Windows'
        run: |
          stage="axon-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir -p "${stage}/bin" "${stage}/lib"
          cp build/axon "${stage}/bin/axon"
          # Bundle llama.cpp shared libs (libllama, libggml*) from build output
          find build/bin -name "lib*.so*" -o -name "lib*.dylib" 2>/dev/null | xargs -I{} cp {} "${stage}/lib/" || true
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp third_party/duckdb/lib/libduckdb.so "${stage}/lib/"
          else
            cp third_party/duckdb/lib/libduckdb.dylib "${stage}/lib/"
            install_name_tool -id @rpath/libduckdb.dylib "${stage}/lib/libduckdb.dylib" || true
            install_name_tool -change \
              "$(pwd)/third_party/duckdb/lib/libduckdb.dylib" \
              "@rpath/libduckdb.dylib" \
              "${stage}/bin/axon" || true
          fi
          cp README.md LICENSE CHANGELOG.md "${stage}/"
          cp scripts/install.sh "${stage}/install.sh"
          cp -r scripts/hooks "${stage}/hooks"
          cp -r scripts/templates "${stage}/templates"
          echo "${stage}" > .stage-name

      - name: Stage release tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $stage = "axon-$ver-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "$stage\bin" | Out-Null
          Copy-Item "build\axon.exe"                      "$stage\bin\axon.exe"
          Copy-Item "third_party\duckdb\lib\duckdb.dll"  "$stage\bin\duckdb.dll"
          Copy-Item "README.md","LICENSE","CHANGELOG.md"  "$stage\"
          Copy-Item "scripts\install.ps1"                 "$stage\install.ps1"
          $stage | Out-File -Encoding ascii .stage-name

      - name: Archive + checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          stage="$(cat .stage-name)"
          tar czf "${stage}.tar.gz" "${stage}"
          shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Archive + checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Get-Content .stage-name -Raw | ForEach-Object { $_.Trim() }
          Compress-Archive -Path "$stage" -DestinationPath "$stage.zip"
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "$stage.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            axon-*-${{ matrix.target }}.tar.gz
            axon-*-${{ matrix.target }}.tar.gz.sha256
            axon-*-${{ matrix.target }}.zip
            axon-*-${{ matrix.target }}.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve version
        id: ver
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ "${tag}" = "${GITHUB_REF}" ]; then tag="${{ github.event.inputs.tag }}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG slice
        # Pull out the section for the released version (between this version's
        # heading and the next one). Failing fall-through emits a stub so the
        # release still lands.
        id: notes
        run: |
          version="${{ steps.ver.outputs.tag }}"
          version="${version#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\["v"\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ steps.ver.outputs.tag }}." > release-notes.md
          fi
          {
            echo "## Checksums"
            echo
            echo '```'
            (cd dist && find . -name '*.sha256' -exec cat {} \;)
            echo '```'
          } >> release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          repository: HideakiSolutions/axon-releases
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: axon ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.gz.sha256
            dist/**/*.zip
            dist/**/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
