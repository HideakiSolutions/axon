name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: hideaki-k3s
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: find scripts/ -name "*.sh" | xargs shellcheck
