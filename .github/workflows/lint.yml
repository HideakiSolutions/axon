name: lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    # Single ShellCheck gate (the duplicate job in ci.yml was removed; this
    # name matches the required status check on main).
    name: ShellCheck
    runs-on: hideaki-k3s
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        # scripts/ gates at default severity; tests/ (smoke + e2e harnesses,
        # added later with pre-existing style infos) gates at warning+.
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 shellcheck
          find tests -name "*.sh" -print0 | xargs -0 shellcheck --severity=warning

  clang-format:
    name: clang-format
    runs-on: hideaki-k3s
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      - name: Check formatting
        # Back-catalog normalized (style: normalize src/ with clang-format 15,
        # tests/ normalized 2026-07-09); this is a real gate and a required
        # check on main.
        run: |
          files=$(find src tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \))
          fail=0
          for f in $files; do
            if ! diff -u "$f" <(clang-format-15 "$f") > /dev/null; then
              echo "::error file=$f::clang-format would reformat"
              fail=1
            fi
          done
          exit $fail
