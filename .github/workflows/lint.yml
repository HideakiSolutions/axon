name: lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (scripts/)
    runs-on: hideaki-k3s
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: find scripts -name "*.sh" -print0 | xargs -0 shellcheck

  clang-format:
    name: clang-format
    runs-on: hideaki-k3s
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15
      - name: Check formatting
        # Back-catalog normalized (style: normalize src/ with clang-format 15);
        # this is now a real gate and a required check on main.
        run: |
          files=$(find src -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \))
          fail=0
          for f in $files; do
            if ! diff -u "$f" <(clang-format-15 "$f") > /dev/null; then
              echo "::error file=$f::clang-format would reformat"
              fail=1
            fi
          done
          exit $fail
